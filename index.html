<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StopWatch</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="box">
        <h2 class="heading">StopWatch</h2>
        <h1 id="timer">00 : 00 : 00</h1>
        <button onclick="start()" style="background-color: rgb(0, 255, 38);">Start</button>
        <button onclick="stop()" style="background-color: rgb(4, 0, 255);">Stop</button>
        <button onclick="reset()" style="background-color: rgb(255, 0, 0);">Reset</button>
    </div>
    <script src="index.js"></script>
</body>
</html>
